version: "1.0"

experiment_profile_name: custom chemostat

metadata:
  author: Cameron Davidson-Pilon
  description: Custom chemostat operation maintaining constant culture volume and nutrient availability. Update after 24h.

common:
  jobs:
    dosing_automation:
      actions:
        - type: start
          t: 0s
          options:
            automation_name: chemostat
            duration: 30
            exchange_volume_ml: 0.75
        - type: update
          t: 1d
          options:
            exchange_volume_ml: 1.5
