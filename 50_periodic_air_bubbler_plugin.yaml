experiment_profile_name: air bubbler with periodic activity

metadata:
  author: Cameron Davidson
  description: Starts the air bubbler immediately, pauses it, and turns on the pump every 30 minutes for 1 minute.

plugins:
  - name: pioreactor-air-bubbler
    version: ">=0.5.0"

pioreactors:
  pio1:
    jobs:
      air_bubbler:
        actions:
          - type: start
            t: 0.0
          - type: pause
            t: 0.01666667 # 1 minute in hours
          - type: repeat
            t: 0.5
            every: 0.5
            actions:
              - type: resume
                t: 0.0
              - type: pause
                t: 0.01666667
