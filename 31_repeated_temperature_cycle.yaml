version: "1.0"

experiment_profile_name: repeated temperature cycle

metadata:
  author: Cameron
  description: This profile changes the temperature in a complex pattern over a 48-hour cycle.

common:
  jobs:
    temperature_automation:
      actions:
        - type: start
          t: 0s
          options:
            automation_name: thermostat
            target_temperature: 28
        - type: repeat
          t: 6h
          every: 2d
          actions:
            - type: update
              t: 0s
              options:
                target_temperature: 30
            - type: update
              t: 6h
              options:
                target_temperature: 32
            - type: update
              t: 12h
              options:
                target_temperature: 34
            - type: update
              t: 18h
              options:
                target_temperature: 36
            - type: update
              t: 1d
              options:
                target_temperature: 34
            - type: update
              t: 30h
              options:
                target_temperature: 32
            - type: update
              t: 36h
              options:
                target_temperature: 30
            - type: update
              t: 42h
              options:
                target_temperature: 28
