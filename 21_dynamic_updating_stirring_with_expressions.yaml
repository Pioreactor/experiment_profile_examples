experiment_profile_name: Dynamic updating stirring with expressions

metadata:
  author: Cam Davidson-Pilon
  description: After 12 hours, updates how fast the Pioreactor stirs based on the current OD value. 

pioreactors:
  worker1:
    jobs:
      stirring:
        actions:
          - type: start
            t: 0
            options:
              target_rpm: 500
          - type: update
            t: 12
            options:
              target_rpm: ${{ worker1:stirring:target_rpm + worker1:od_reading:od2.od * 10 }}
