version: "1.0"

experiment_profile_name: demo stirring repeat

metadata:
  author: Cam Davidson-Pilon
  description: A simple climbing RPM example

inputs:
  delta_up: 100.0
  delta_down: 50.0

common:
  jobs:
    stirring:
      actions:
        - type: start
          t: 0s
          options:
            target_rpm: 400.0
        - type: repeat
          t: 1h
          while: ${{::stirring:target_rpm <= 1000}}
          every: 30m
          actions:
            - type: update
              t: 0s
              options:
                target_rpm: ${{::stirring:target_rpm + delta_up}}
            - type: update
              t: 15m
              options:
                target_rpm: ${{::stirring:target_rpm - delta_down}}
