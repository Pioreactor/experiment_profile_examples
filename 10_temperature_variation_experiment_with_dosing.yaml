experiment_profile_name: temperature variation experiment with dosing

metadata:
  author: Pete Davidson
  description: >
    At start, stirring, temperature, and a chemostat (volume=1, duration=20) will start.
    Start temperature is 35 C for all bioreactors.
    After 24 hours, the temperature in pio00 will increase by 2 C every two hours until it reaches a maximum of 50 C, after which the temperature stays constant.
    After 24 hours, the temperature in pio01 will increase by 1 C every two hours until it reaches a maximum of 50 C, after which the temperature stays constant.
    After 24 hours, the temperature in pio02 will increase by 4 C every four hours until it reaches a maximum of 50 C, after which the temperature stays constant.

common:
  jobs:
    stirring:
      actions:
        - type: start
          t: 0s
    dosing_automation:
      actions:
        - type: start
          t: 0s
          options:
            automation_name: chemostat
            exchange_volume_ml: 1.0
            duration: 20
    temperature_automation:
      actions:
        - type: start
          t: 0s
          options:
            automation_name: thermostat
            target_temperature: 35

pioreactors:
  pio00:
    jobs:
      temperature_automation:
        actions:
          - type: repeat
            t: 1d
            every: 2h
            while: ${{ pio00:temperature_automation:target_temperature < 50 }}
            actions:
              - type: update
                t: 0s
                options:
                  target_temperature: ${{ pio00:temperature_automation:target_temperature + 2 }}
  pio001:
    jobs:
      temperature_automation:
        actions:
          - type: repeat
            t: 1d
            every: 2h
            while: ${{ pio001:temperature_automation:target_temperature < 50 }}
            actions:
              - type: update
                t: 0s
                options:
                  target_temperature: ${{ pio001:temperature_automation:target_temperature + 1 }}

  pio02:
    jobs:
      temperature_automation:
        actions:
          - type: repeat
            t: 1d
            every: 4h
            while: ${{ pio02:temperature_automation:target_temperature < 50 }}
            actions:
              - type: update
                t: 0s
                options:
                  target_temperature: ${{ pio02:temperature_automation:target_temperature + 4 }}
