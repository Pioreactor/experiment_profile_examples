version: "1.0"

experiment_profile_name: dosing and leds

metadata:
  author: Cameron Davidson-Pilon
  description: dose, then dose a bit after 15 minutes. Change LEDs immediately, and again after an hour.


pioreactors:
  worker1:
    jobs:
      add_media:
        actions:
          - type: start
            t: 0s
            options:
              ml: 14.0
          - type: start
            t: 15m
            options:
              ml: 1.0
      led_intensity:
        actions:
          - type: start
            t: 0s
            options:
              B: 50
              C: 50
          - type: update
            t: 1h
            options:
              B: 25
              C: 25
              D: 100
          - type: stop
            t: 90m
