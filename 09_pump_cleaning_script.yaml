version: "1.0"

experiment_profile_name: pump cleaning script

metadata:
  description: This starts the waste pump on all Pioreactors, then the media pump, and runs both for X seconds and Y seconds respectively.
  author: Cam DP
 
common:
  jobs:
    remove_waste:
      actions:
        - type: start
          t: 0s
          options:
             continuously: true
        - type: stop
          t: 1.98m
    add_media:
      actions:
        - type: start
          t: 7.2s
          options:
             continuously: true
        - type: stop
          t: 108s
