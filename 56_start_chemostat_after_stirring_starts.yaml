experiment_profile_name: start_chemostat_after_stirring_starts
metadata:
  author: Your Name
  description: Start chemostat when stirring starts

common:
  jobs:
    stirring:
      actions:
        - type: start
          t: 0.002
    dosing_automation:
      actions:
        - type: when
          wait_until: ${{::stirring:$state == ready}}
          t: 0
          actions:
            - type: start
              t: 0
              options:
                automation_name: chemostat
                exchange_volume_ml: 0.63
                duration: 9



